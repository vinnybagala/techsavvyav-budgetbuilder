<style>
  :root{
    --bg:#080B11; --bg2:#0C1119; --grad1:#0d2438; --grad2:#0a141f;
    --panel:rgba(255,255,255,.035); --panel2:#111823; --panelSolid:#0F1620;
    --glass-brd:rgba(255,255,255,.09); --glass-hi:rgba(255,255,255,.06);
    --ink:#EAF1F8; --ink2:#C6D2DE; --muted:#7E8B9A; --faint:#5A6675;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --brand:#004878; --accent:#3898DB; --accent2:#5FB4F2; --accent-deep:#0A3A5C;
    --good:#7C8DA3; --better:#3898DB; --best:#E2B45F;
    --ok:#38C172; --warn:#E2B45F; --bad:#F26D6D;
    --field:#0B111A;
    --shadow:0 12px 40px -12px rgba(0,0,0,.7);
    --glow:0 0 0 1px rgba(56,152,219,.35), 0 8px 30px -8px rgba(56,152,219,.45);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.5;-webkit-text-size-adjust:100%;
    background-image:radial-gradient(1100px 500px at 80% -10%,rgba(56,152,219,.10),transparent 60%),
                     radial-gradient(900px 500px at -10% 0%,rgba(0,72,120,.18),transparent 55%);
    background-attachment:fixed;}
  ::selection{background:rgba(56,152,219,.35)}

  /* header */
  header.app{display:flex;align-items:center;gap:14px;padding:14px 20px;
    background:linear-gradient(180deg,rgba(10,20,32,.92),rgba(8,12,18,.82));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  header.app .brand{display:flex;align-items:center;gap:12px}
  header.app img.logo{height:34px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(56,152,219,.25))}
  header.app .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
    border-left:1px solid var(--line2);padding-left:12px;font-weight:600}
  .spacer{flex:1}
  .badge{background:rgba(56,152,219,.12);border:1px solid rgba(56,152,219,.35);color:var(--accent2);

    border-top:1px solid var(--line);font-size:13.5px}

  .assignrow .loc{font-size:11px;color:var(--muted)}
  .toggle{width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;

  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s;

  .tierpick{border-radius:9px;padding:6px 8px;font-size:12px;width:158px}
  .qtybox{width:58px;text-align:center;padding:6px}
  .rowline{width:96px;text-align:right;font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink)}

  .layout{display:grid;grid-template-columns:1fr 312px;gap:18px;align-items:start}

  @media(max-width:900px){.rail{position:static}}
  .sumline{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
  .sumline .l{color:var(--muted)}
  .sumline span:last-child{font-variant-numeric:tabular-nums}
  .sumline.tot{border-bottom:none;font-size:20px;font-weight:800;padding-top:12px;color:var(--ink)}
  .romband{background:linear-gradient(150deg,rgba(56,152,219,.2),rgba(0,72,120,.14));

    box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

    text-shadow:0 2px 14px rgba(56,152,219,.5)}

  .banner{background:linear-gradient(180deg,rgba(226,180,95,.12),rgba(226,180,95,.04));border:1px solid rgba(226,180,95,.3);
    color:#ecd3a0;border-radius:12px;padding:11px 14px;font-size:12.5px;margin-bottom:16px}

  /* report */
  .rsys{border:1px solid var(--line2);border-radius:14px;margin-bottom:14px;overflow:hidden;break-inside:avoid;background:rgba(255,255,255,.02)}

  .rsys .hd .amt{margin-left:auto;font-weight:800;color:var(--accent2);font-variant-numeric:tabular-nums}
  .rsys .desc{padding:11px 16px;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px}

  .repletter .rl-name{font-size:21px;font-weight:800;letter-spacing:-.3px;margin-top:1px}
  .rhero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border:1px solid var(--line2);border-radius:14px;padding:18px 22px;margin-bottom:22px;background:rgba(56,152,219,.06)}

  .rm{color:var(--ink);font-weight:600}

  .hide{display:none!important}

  @page{size:letter;margin:15mm}
  @media print{
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}

    .only-print{display:block!important} .only-screen{display:none!important}
  }
  /* ---------- auth / dashboard / admin shells ---------- */
  #view-auth{min-height:100vh;display:none;place-items:center;padding:24px;

  <label>Password</label>
  <input id="li_pw" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">

<script>
/* ============================================================

const ROOM_TYPES=["Great Room","Living Room","Family Room","Kitchen","Dining Room","Primary Bedroom","Bedroom","Primary Bath","Bathroom","Home Office","Media / Theater","Home Gym","Foyer / Entry","Hallway","Mudroom","Laundry","Garage","Patio / Outdoor","Pool / Spa","Wine Room","Bonus / Game Room","Nursery","Walk-in Closet","Utility / Mechanical"];

/* Rates calibrated from 13 Tech Savvy proposals (Bay Area, 2026), $117k–$756k — all-in incl. labor. Rates converged:
     • 2360 Washington (SF) $206k — value: Eero network, standard in-ceiling audio → Good anchors
     • 3445 Washington (7,100 SF) $335k — premium: invisible audio, HomeWorks lighting, hardwired shades (TS-supplied)
     • 3015 Pacific (SF) $238k — HomeWorks + Forbes&Lomax custom keypads ($133k lighting)
     • 36 Hill (Kentfield) $249k — Savant control, enterprise network, James custom audio
     • 21 Glenwood (Ross) $594k — multi-building estate: UniFi network, 31-kp HomeWorks, Control4 ($37k)
     • 324 Palm (Kentfield) $195k — value: UniFi, Ring cams, HomeWorks SeeTouch (~$2.4k/kp), prewire broken out ($52k LV wiring)
     • 1170 Castle (Sonoma) $338k — estate: Maestro value lighting, James audio, Verkada cams (~$2.9k), multi-gate access
     • 3075 Pacific (SF) $174k — invisible-audio AV, Verkada cams, Control4 Core-Lite (small control) — confirmed all rates
     • 16 Presidio (SF) $295k — whole-house invisible audio + James soundbars/Marantz surround, enterprise net, Ring cams
     • Lambert (SF) $167k — TS-supplied shades (~$5k/opening, confirms shade rate); heavy client-provided [OFE] gear (skews labor to 89%, understates equipment)
     • Bunting (Petaluma) $211k — Control4 wireless lighting (~$611/kp, value anchor); labor 46% (equipment-heavy)
     • Prince $117k — medium, URC control, Luma 4MP cams — confirmed all rates
     • Faxon $756k — large multi-building AV+network estate, James/Seura premium; labor 54%
   Confident (n≥5): network, access ~$2,750/entry, surveillance ($850 Ring→$2,800 Verkada/8MP), lighting (Good ~$0.6–1.4k/kp wireless, Better ~$2.8k HomeWorks, Best ~$4.2k custom), video Better ~$11k, invisible audio ~$9.5k/zone, shades (n=2) ~$4.5–6k/opening TS-supplied.
   NOTE: labor ~68% of equipment typical (gear-dependent; Bunting's 46% is a likely low outlier, client-provided gear inflates it) — all-in rates already include it. Video head-end scales with # video rooms (control fix).
   OPEN ITEMS: HVAC ($15k estate) & prewire-per-SF not yet modeled as systems. */
const SYSTEMS={
  network:{name:"Network & Structured Wiring",ico:"🌐",unit:"SF",basis:"sf",
    blurb:"The wired foundation the whole home runs on — full standard Cat6/6A structured cabling in every home, with managed switching and Wi-Fi sized to the home. Access-point count and drops scale with the home's size, so it's priced per square foot (rack included). Every home is wired to the same standard; the tier sets the network gear — business-class Wi-Fi with a dedicated firewall comes in at the Better and Best levels.",
    headend:null,
    tiers:{Good:{price:6,mean:"Value / mesh WiFi (Eero)"},Better:{price:8,mean:"Enterprise Wi-Fi + managed switching"},Best:{price:10,mean:"Enterprise + firewall + redundancy / multi-building"}},
    q:[{k:"rack",label:"Equipment rack",opts:["Standard (included)","Large multi-bay (+$6,000)","Enterprise rack + UPS (+$12,000)"]}]},
  control:{name:"Home Control System",ico:"🎛️",unit:"interface",
    blurb:"The processor and programming that unify every system into one experience — operated from handheld remotes, in-wall touchscreens, and the app. Control4, Savant, Crestron, or URC.",
    headend:{label:"Control processor & system programming",price:9000},
    tiers:{Good:{price:1000,mean:"Handheld remote / keypad (Control4, URC)"},Better:{price:1800,mean:"iPad dock or in-wall touchscreen (Savant / Control4)"},Best:{price:2800,mean:"Crestron / premium touch interface"}},
    q:[{k:"platform",label:"Control platform",opts:["Control4","Savant","Crestron","URC","Best fit"]},
       {k:"proc",label:"Central processor?",opts:["Yes — Savant / Control4 / Crestron host","No — iPad docks / app only (no processor)"]}]},
  audio:{name:"Multi-Room Audio",ico:"🔊",unit:"zone",spkPerZone:2,prewire:300,
    blurb:"Streaming audio to architectural speakers throughout the home and outdoors — independent volume and sources by room, controlled from keypad, touchscreen, app, or voice. Rooms can also be set to pre-wire only (speaker wire roughed in, no speakers).",
    headend:{label:"Streaming sources & multi-zone amplification",price:8000},
    tiers:{Good:{price:4400,mean:"Standard in-ceiling speakers (Sonance VX)"},Better:{price:9500,mean:"Invisible or small-aperture speakers"},Best:{price:14000,mean:"Invisible / small-aperture + subwoofer"}},
    q:[]},
  video:{name:"Video & TV",ico:"📺",unit:"TV",prewire:550,
    blurb:"Televisions and dedicated media rooms — displays mounted or concealed, shared sources, and surround sound, all wired and calibrated. From a single TV to a full theater. Rooms can also be set to pre-wire only (TV/AV drop roughed in, no display).",
    headend:{label:"Video matrix & AV distribution rack",price:6500},
    tiers:{Good:{price:4800,mean:"Display + mount + source (audio from a zone)"},Better:{price:7000,mean:"Display + soundbar + sub (e.g. Sonos Arc)"},Best:{price:22000,mean:"Media room — full surround + sub / theater"}},
    q:[{k:"display",label:"Display style",opts:["Standard mount","Recessed / concealed","The Frame / art-mode","Projector + screen"]}]},
  lighting:{name:"Lighting Control",ico:"💡",unit:"keypad",
    blurb:"Programmable lighting with elegant keypads and dimmers in place of cluttered switch banks — everyday scenes plus whole-home 'goodnight' and 'away.' Priced per keypad. Better is standard wired keypads (See-Touch); Best is premium wired (Palladiom). Ultra-custom keypads (Forbes & Lomax / Ketra) run above Best — bump the tier or note manually.",
    headend:null,
    tiers:{Good:{price:1100,mean:"Wireless dimmers (RA3 / Maestro / Control4)"},Better:{price:2300,mean:"HomeWorks wired — standard keypads (See-Touch)"},Best:{price:3400,mean:"HomeWorks wired — premium keypads (Palladiom)"}},
    q:[{k:"eco",label:"Platform",opts:["Lutron HomeWorks (wired)","Lutron RA3 (wireless)","Ketra"]}]},
  shades:{name:"Motorized Shades & Curtains",ico:"🪟",unit:"opening",
    blurb:"Automated shades, drapery, and curtains on scenes and schedules — managing daylight, glare, privacy, and heat. Better is standard exposed-roller shades; Best adds recessed pockets, which add cost. Count one opening per motorized shade — a room with two shades is qty 2.",
    headend:{label:"Lutron shade hub & integration",price:2500},
    tiers:{Good:{price:1600,mean:"Battery roller, standard fabric"},Better:{price:3200,mean:"Standard shades — hardwired roller / Roman, premium fabric"},Best:{price:6500,mean:"Recessed-pocket shades / drapery, custom"}},
    q:[]},
  surveillance:{name:"Surveillance Cameras",ico:"📹",unit:"camera",
    blurb:"IP camera coverage with cloud recording and remote viewing — no local NVR — from residential cameras to 4K AI-verified security at entries, gates, and the perimeter.",
    headend:null,
    tiers:{Good:{price:850,mean:"1080p / battery, cloud (Ring)"},Better:{price:2400,mean:"4K cloud (Verkada / cloud-managed)"},Best:{price:3400,mean:"8MP varifocal / PTZ / gate runs, cloud"}},
    q:[]},
  access:{name:"Entry & Access",ico:"🚪",unit:"entry",flat:true,
    types:[{k:"entry",label:"Entry / intercom station",price:4250},{k:"interior",label:"Interior station",price:1400},{k:"chime",label:"Chime (wired)",price:600}],
    blurb:"Video intercom entry, smart locks, and gate or driveway integration — see and speak to anyone at the door or gate, and control who gets in. Wired door chimes can be added per location.",
    headend:{label:"Access controller & integration",price:2200},
    tiers:{Good:{price:4250,mean:"DoorBird D2201KV intercom station (per entry)"},Better:{price:4250,mean:"DoorBird D2201KV intercom station (per entry)"},Best:{price:4250,mean:"DoorBird D2201KV intercom station (per entry)"}},
    q:[]},
};
const TIERS=["Good","Better","Best"];
const TIERCLASS={Good:"g",Better:"b",Best:"p"};

/* ============================================================ STATE ============================================================ */
let step=0, guest=false;
const project={name:"New Residence",client:"",gc:"",arch:"",zip:"",band:3,cont:0,tax:8.625,freight:2,homeSF:0};
let rid=1, fid=1, bid=1;
let structure=[];
let selected=new Set();
let assign={};
let sysAnswers={};
let sfTier={};  // tier selection for square-foot-priced systems (e.g. network), keyed by system

function seed(){
  const b={id:bid++,name:"Main House",floors:[]};
  const f1={id:fid++,name:"Main Level",rooms:[
    {id:rid++,name:"Great Room",type:"Great Room"},
    {id:rid++,name:"Kitchen",type:"Kitchen"},
    {id:rid++,name:"Home Office",type:"Home Office"},
    {id:rid++,name:"Primary Bedroom",type:"Primary Bedroom"}]};
  const f2={id:fid++,name:"Lower Level",rooms:[
    {id:rid++,name:"Media Room",type:"Media / Theater"},
    {id:rid++,name:"Guest Bedroom",type:"Bedroom"}]};
  b.floors.push(f1,f2);structure.push(b);
  ["network","audio","video","lighting","shades"].forEach(k=>selected.add(k));
  rebuildAssign();
  const rooms=allRooms();
  selected.forEach(k=>{rooms.forEach(r=>{
    const def=(k==="video")?(r.type==="Media / Theater"):true;
    assign[k][r.id]={on:def,tier:"Better",qty:1};});});
}

const $=id=>document.getElementById(id);
const money=n=>"$"+Math.round(n).toLocaleString();
function allRooms(){const o=[];structure.forEach(b=>b.floors.forEach(f=>f.rooms.forEach(r=>o.push({...r,bldg:b.name,floor:f.name}))));return o;}
function rebuildAssign(){
  selected.forEach(k=>{if(!assign[k])assign[k]={};});
  Object.keys(assign).forEach(k=>{if(!selected.has(k))delete assign[k];});
  const rooms=allRooms();
  selected.forEach(k=>{rooms.forEach(r=>{if(!assign[k][r.id])assign[k][r.id]={on:false,tier:"Better",qty:1};});});
}
/* head-end (infrastructure) cost per system — a flat per-project figure added when the system has any rooms.
   Home Control now scales naturally via per-interface pricing, so head-ends are fixed. */
function headendPrice(k){const S=SYSTEMS[k];if(!S||!S.headend)return 0;
  if(k==='control'){const a=sysAnswers.control;if(a&&/^No/.test(a.proc||''))return 0;} // iPad docks / app only — no processor
  return S.headend.price;}
function homeSFval(){return Math.max(0,parseFloat(project.homeSF)||0);}
function psfTag(cost){const sf=homeSFval();return sf>0?' · $'+(cost/sf).toFixed(2)+'/SF':'';}
function accessType(S,a){if(!S.types)return null;return S.types.find(x=>x.k===(a&&a.kind||S.types[0].k))||S.types[0];}
function roomUnitCost(k,a,tier){const S=SYSTEMS[k];
  if(a.pw&&S.prewire)return S.prewire;                       // pre-wire only (speaker wire, no gear)
  if(S.types){const t=accessType(S,a);return t.price*(a.qty||1);}  // typed flat system (entry vs chime)
  return S.tiers[tier||a.tier].price*(a.qty||1);}
function rackAdder(k){if(k!=='network')return 0;const a=sysAnswers.network;if(!a)return 0;
  if(/Enterprise/.test(a.rack||''))return 12000;
  if(/Large/.test(a.rack||''))return 6000;
  return 0;}
function systemRoomCost(k){const S=SYSTEMS[k];
  if(S.basis==='sf'){const t=sfTier[k]||'Better';return (S.tiers[t]?S.tiers[t].price:0)*homeSFval()+rackAdder(k);}
  let sum=0,anyOn=false;
  allRooms().forEach(r=>{const a=assign[k]&&assign[k][r.id];if(a&&a.on){anyOn=true;sum+=roomUnitCost(k,a);}});
  if(anyOn&&S.headend)sum+=headendPrice(k);return sum;}
function systemSpanCost(k,tier){const S=SYSTEMS[k];
  if(S.basis==='sf'){return (S.tiers[tier]?S.tiers[tier].price:0)*homeSFval()+rackAdder(k);}
  let sum=0,anyOn=false;
  allRooms().forEach(r=>{const a=assign[k]&&assign[k][r.id];if(a&&a.on){anyOn=true;sum+=roomUnitCost(k,a,tier);}});
  if(anyOn&&S.headend)sum+=headendPrice(k);return sum;}
function directTotal(){let s=0;selected.forEach(k=>s+=systemRoomCost(k));return s;}
/* investment positioning (placeholder bands — edit to taste) */
function investLevel(total){
  if(total<100000)return {name:"Essential",cls:"g",blurb:"Core connectivity & comfort"};
  if(total<300000)return {name:"Signature",cls:"b",blurb:"Fully integrated smart home"};
  return {name:"Estate",cls:"p",blurb:"Reference-grade, no compromises"};}
function setWholeHome(t){selected.forEach(k=>{if(SYSTEMS[k].basis==='sf')sfTier[k]=t;});
  allRooms().forEach(r=>{selected.forEach(k=>{if(SYSTEMS[k].basis==='sf')return;
    const def=(k==='video')?(r.type==='Media / Theater'):true;
    assign[k][r.id].on=def;if(!SYSTEMS[k].flat)assign[k][r.id].tier=t;});});render();}
/* Equipment is ~60% of the all-in systems cost (labor ~40% is untaxed). Sales tax & freight apply to that equipment portion. */
const EQUIP_SHARE=0.60;
function totals(){const direct=directTotal();
  const cont=direct*(project.cont||0)/100;
  const equip=direct*EQUIP_SHARE;
  const tax=equip*(parseFloat(project.tax)||0)/100;
  const freight=equip*(parseFloat(project.freight)||0)/100;
  return {direct,design:0,cont,tax,freight,total:direct+cont+tax+freight};}

const STEPS=["Project","Building","Systems","Configure","Report"];
function renderStepper(){$("stepper").innerHTML=STEPS.map((s,i)=>
  `<div class="step ${i===step?'active':''} ${i<step?'done':''}" onclick="goto(${i})"><span class="n">${i<step?'✓':i+1}</span>${s}</div>`).join("");}
function goto(i){
  if(i>=1&&!(homeSFval()>0)){alert("Enter the project square footage first — the budget can't be calculated without it.");return;}
  if(i>=2&&allRooms().length===0){alert("Add at least one room first.");return;}
  step=i;render();window.scrollTo(0,0);}
function next(){if(step<4){step++;render();window.scrollTo(0,0);}}
function back(){if(step>0){step--;render();window.scrollTo(0,0);}}

let _focusId=null;
function render(){renderStepper();{const bd=$("badge");if(bd)bd.textContent=guest?"Guest · view + choices":"Internal";}
  if(step===0)screenProject();else if(step===1)screenStructure();else if(step===2)screenSystems();else if(step===3)screenConfigure();else screenReport();
  if(_focusId){const el=$(_focusId); if(el){el.focus();} _focusId=null;}}

/* ---- ZIP → sales tax (California, calibrated to Tech Savvy's footprint; always editable) ---- */
function taxFromZip(zip){
  zip=(zip||"").trim();
  if(!/^\d{5}$/.test(zip)) return null;
  const CITY={
    "95476":{r:10.25,a:"Sonoma"},
    "94901":{r:9.25,a:"San Rafael"},"94903":{r:9.25,a:"San Rafael"}
  };
  if(CITY[zip]) return CITY[zip];
  if(/^9495/.test(zip)) return {r:10.25,a:"Petaluma"};        // Petaluma (Sonoma Co.)
  if(/^9540/.test(zip)) return {r:9.50,a:"Santa Rosa"};
  const P3={
    "941":{r:8.625,a:"San Francisco"},
    "949":{r:8.25, a:"Marin County"},
    "954":{r:9.00, a:"Sonoma County"},
    "955":{r:9.00, a:"North Bay"},
    "945":{r:9.25, a:"Contra Costa / East Bay"},
    "946":{r:10.75,a:"Oakland / Alameda Co."},
    "947":{r:10.25,a:"Berkeley / Alameda Co."},
    "948":{r:9.75, a:"Richmond / Contra Costa"},
    "940":{r:9.375,a:"Peninsula / San Mateo"},
    "944":{r:9.625,a:"San Mateo County"},
    "943":{r:9.125,a:"Palo Alto / Santa Clara"},
    "950":{r:9.375,a:"Santa Clara County"},
    "951":{r:9.375,a:"San Jose / Santa Clara"}
  };
  const hit=P3[zip.slice(0,3)];
  if(hit) return hit;
  return {r:project.tax||8.625,a:"outside usual area",guess:true};
}
function onZip(v){
  project.zip=(v||"").trim();
  const t=taxFromZip(project.zip);
  if(t){project.tax=t.r;project._taxArea=t.a;project._taxGuess=!!t.guess;}
  render();
}
/* GC / Architect firm picker (native dropdown + "Other" for custom names) */
let _otherFlags={};
function firmField(field,label,placeholder){
  const val=(project[field]||"").trim();
  const names=(FIRMS||[]).map(f=>f.firm_name);
  const matched=names.find(n=>n.toLowerCase()===val.toLowerCase());
  const other=!!_otherFlags[field] || (val && !matched);
  const canAdd = meProfile && meProfile.role==='admin';
  let opts=`<option value="">— Select ${esc(label)} —</option>`;
  opts+=names.map(n=>`<option value="${esc(n)}" ${(!other&&n===matched)?'selected':''}>${esc(n)}</option>`).join("");
  opts+=`<option value="__other__" ${other?'selected':''}>Other (type a name)…</option>`;
  if(canAdd) opts+=`<option value="__addnew__">➕ Add new firm…</option>`;
  let h=`<div class="field"><label>${esc(label)}</label>
    <select onchange="onFirmSelect('${field}',this.value)">${opts}</select>`;
  if(other) h+=`<input style="margin-top:6px" value="${esc(project[field]||'')}" placeholder="${esc(placeholder)}" onchange="setP('${field}',this.value)">`;
  return h+`</div>`;
}
function onFirmSelect(field,v){
  if(v==='__addnew__'){ openAddFirmForField(field); return; }
  if(v==='__other__'){ _otherFlags[field]=true; }
  else { _otherFlags[field]=false; project[field]=v; }
  render();
}
function openAddFirmForField(field){
  const type = field==='arch' ? 'Architect' : 'GC';
  modalHTML(`<h3>Add a new firm</h3>
    <p class="hint" style="margin-top:-4px">Creates a login and adds them to the list. They'll be set as the ${field==='arch'?'architect':'GC'} on this budget, giving them access.</p>
    <div class="field"><label>Firm name</label><input id="nf_name" placeholder="Acme Builders"></div>
    <div class="row"><div class="field"><label>Type</label><select id="nf_type"><option ${type==='GC'?'selected':''}>GC</option><option ${type==='Architect'?'selected':''}>Architect</option><option>Other</option></select></div>
      <div class="field"><label>Login email</label><input id="nf_email" type="email" placeholder="admin@firm.com"></div></div>
    <div class="field"><label>Temporary password</label><input id="nf_pw" value="Budgetbuilder2026!"></div>
    <div class="autherr" id="nf_err"></div>
    <div class="navbtns"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="nf_btn" onclick="submitAddFirmForField('${field}')">Create &amp; assign</button></div>`);
}
async function submitAddFirmForField(field){
  const firm_name=$("nf_name").value.trim(), firm_type=$("nf_type").value, email=$("nf_email").value.trim(), password=$("nf_pw").value;
  if(!firm_name||!email||!password){$("nf_err").textContent="Firm name, email and password are required.";$("nf_err").className="autherr show";return;}
  $("nf_btn").disabled=true;$("nf_btn").textContent="Creating…";
  const {data,error}=await sb.functions.invoke("firm-admin",{body:{action:"create_firm",firm_name,firm_type,email,password}});
  if(error||data?.error){$("nf_err").textContent=data?.error||error.message;$("nf_err").className="autherr show";$("nf_btn").disabled=false;$("nf_btn").innerHTML="Create &amp; assign";return;}
  try{ const {data:fd}=await sb.from("firm_directory").select("firm_name,firm_type").order("firm_name"); FIRMS=fd||[]; }catch(e){}
  project[field]=firm_name; _otherFlags[field]=false;
  closeModal(); toast("Firm created & assigned"); render();
}

/* STEP 1 — PROJECT DETAILS */
function screenProject(){
  const t=taxFromZip(project.zip);
  let taxNote;
  if(!project.zip) taxNote=`Enter the project ZIP and we'll fill in the local sales-tax rate.`;
  else if(!t) taxNote=`Enter a valid 5-digit ZIP to auto-fill the tax rate.`;
  else if(t.guess) taxNote=`ZIP is outside our usual area — please verify this rate.`;
  else taxNote=`Auto-filled for <b>${t.a}</b> — editable if a specific tax district differs.`;
  let h=`<div class="card"><h2 class="t">Project details <span class="accentdot">.</span></h2>
    <p class="hint">A few basics to anchor the budget. ZIP sets the local sales-tax rate; square footage drives the whole estimate — both are required before we can price anything. Picking a GC or architect that has a Tech Savvy login gives that firm access to this budget from their own dashboard.</p>
    <div class="row3">

    <div class="row3">

        <div class="note" style="margin-top:5px">${taxNote}</div></div>
      <div></div><div></div></div>

/* STEP 2 — BUILDING */
function screenStructure(){
  let h=`<div class="card"><h2 class="t">Build the home <span class="accentdot">.</span></h2>

      <div style="font-size:28px">📄</div><b>Upload plans (PDF / image)</b>
      <div class="note" style="margin-top:4px">We'll stage the file and — once take-off is live — pre-fill rooms here.</div>
      <input id="planfile" type="file" class="hide" onchange="planUploaded(this)"></div>
    <div id="planmsg"></div><div class="or">then confirm / build rooms</div>`;
  structure.forEach(b=>{
    h+=`<div class="bldg"><div class="hd">🏠 <input value="${esc(b.name)}" onchange="renameB(${b.id},this.value)" style="font-weight:700">
        <button class="btn ghost mini no-print" onclick="delB(${b.id})">Remove</button></div>`;
    b.floors.forEach(f=>{
      h+=`<div class="floor"><div class="hd">🪜 <input value="${esc(f.name)}" onchange="renameF(${f.id},this.value)" style="font-weight:700;max-width:230px">
          <span class="note">${f.rooms.length} room${f.rooms.length!==1?'s':''}</span>
          <button class="btn ghost mini no-print" style="margin-left:auto" onclick="delF(${f.id})">Remove floor</button></div>
        <div class="rooms">`;
      f.rooms.forEach(r=>{h+=`<span class="roomchip">${esc(r.name)}<button class="x no-print" onclick="delR(${r.id})">×</button></span>`;});
      h+=`</div><div class="addroom no-print">
          <select id="rt_${f.id}">${ROOM_TYPES.map(t=>`<option>${t}</option>`).join("")}</select>
          <input id="rn_${f.id}" placeholder="Custom name (optional)" onkeydown="if(event.key==='Enter'){event.preventDefault();addR(${f.id});}">
          <button class="btn primary mini" onclick="addR(${f.id})">+ Room</button></div></div>`;});
    h+=`<div class="inlineadd no-print" style="margin-top:10px"><input id="fn_${b.id}" placeholder="New floor (e.g. Upper Level)" onkeydown="if(event.key==='Enter'){event.preventDefault();addF(${b.id});}">
        <button class="btn ghost mini" onclick="addF(${b.id})">+ Floor</button></div></div>`;});
  h+=`<div class="inlineadd no-print" style="margin-top:10px"><input id="newb" placeholder="New building (e.g. Guest House, Garage)" onkeydown="if(event.key==='Enter'){event.preventDefault();addB();}">
      <button class="btn ghost mini" onclick="addB()">+ Building</button></div></div>
    <div class="navbtns"><button class="btn ghost" onclick="back()">← Back</button><button class="btn primary" onclick="next()">Next: choose systems →</button></div>`;
  $("screen").innerHTML=h;
}
function planUploaded(inp){const f=inp.files[0];if(!f)return;$("planmsg").innerHTML=`<div class="banner">✅ <b>${esc(f.name)}</b> staged. Automatic room detection isn't wired up in this prototype — confirm or add rooms below and we'll map budgets to them.</div>`;}

/* STEP 2 */
function screenSystems(){
  let h=`<div class="card"><h2 class="t">Which systems go in this home?</h2>
    <p class="hint">Pick everything Tech Savvy is scoping. You'll assign each one to specific rooms next.</p><div class="sysgrid">`;
  Object.keys(SYSTEMS).forEach(k=>{const S=SYSTEMS[k],on=selected.has(k);
    h+=`<div class="syscard ${on?'sel':''}" onclick="toggleSys('${k}')"><div class="ico">${S.ico}</div>
      <div><div class="nm">${S.name}</div><div class="ds">${S.blurb}</div></div><div class="chk">${on?'✓':''}</div></div>`;});
  h+=`</div></div><div class="navbtns"><button class="btn ghost" onclick="back()">← Back</button>
      <button class="btn primary" onclick="next()" ${selected.size?'':'disabled'}>Next: configure (${selected.size}) →</button></div>`;
  $("screen").innerHTML=h;
}
function toggleSys(k){if(selected.has(k))selected.delete(k);else selected.add(k);rebuildAssign();
  if(selected.has(k))allRooms().forEach(r=>{if(!assign[k][r.id].on&&k!=="video")assign[k][r.id].on=true;});render();}

/* STEP 3 */
function screenConfigure(){
  const rooms=allRooms();
  let h=`<div class="layout"><div><div class="card"><h2 class="t">Configure each system</h2>
    <p class="hint">Toggle the rooms each system covers and set the quality level per room. Or use Express to price the whole home in one tap, then fine-tune.</p>
    <div class="quickset" style="margin:2px 0 0"><span class="lb">⚡ Express — set the entire home to:</span>
      <button class="qbtn g" onclick="setWholeHome('Good')">Good</button>
      <button class="qbtn b" onclick="setWholeHome('Better')">Better</button>
      <button class="qbtn p" onclick="setWholeHome('Best')">Best</button></div></div>`;
  Array.from(selected).forEach(k=>{const S=SYSTEMS[k];const cost=systemRoomCost(k);
    if(S.basis==='sf'){const sf=homeSFval();const t=sfTier[k]||'Better';
      h+=`<div class="cfg"><div class="hd"><span class="ico">${S.ico}</span><span class="nm">${S.name}</span><span class="sub">${money(cost)}<span style="color:var(--muted);font-weight:600">${psfTag(cost)}</span></span></div>
        <div class="bd">
          <div class="field" style="max-width:280px"><label>Home size (square feet)</label>
            <input type="number" min="0" value="${project.homeSF||''}" placeholder="e.g. 5000" onchange="setP('homeSF',this.value)"></div>
          <div class="tierlegend">
            <span><b class="pill g">Good</b> ${S.tiers.Good.mean} · $${S.tiers.Good.price}/SF</span>
            <span><b class="pill b">Better</b> ${S.tiers.Better.mean} · $${S.tiers.Better.price}/SF</span>
            <span><b class="pill p">Best</b> ${S.tiers.Best.mean} · $${S.tiers.Best.price}/SF</span></div>`;
      if(S.q&&S.q.length&&!guest){h+=S.q.map(q=>`<div class="q"><label>${q.label}</label><select onchange="setAns('${k}','${q.k}',this.value)">${q.opts.map(o=>`<option ${((sysAnswers[k]||{})[q.k]===o)?'selected':''}>${o}</option>`).join("")}</select></div>`).join("");}
      h+=`<div class="quickset no-print"><span class="lb">Grade:</span>
            <button class="qbtn g" onclick="setSfTier('${k}','Good')">Good</button>
            <button class="qbtn b" onclick="setSfTier('${k}','Better')">Better</button>
            <button class="qbtn p" onclick="setSfTier('${k}','Best')">Best</button></div>
          <div class="assignrow"><div><b>${sf?sf.toLocaleString():'—'} SF</b> × $${S.tiers[t].price}/SF<div class="loc">${t} grade${sf?'':' — enter home size above'}</div></div><div></div><div></div><div class="rowline">${money(cost)}</div></div>
        </div></div>`;
      return;}
    h+=`<div class="cfg"><div class="hd"><span class="ico">${S.ico}</span><span class="nm">${S.name}</span><span class="sub">${money(cost)}<span style="color:var(--muted);font-weight:600">${psfTag(cost)}</span></span></div>
      <div class="bd"><div class="tierlegend">${S.flat?
        `<span><b class="pill b">Standard</b> ${S.tiers.Good.mean} · ${money(S.tiers.Good.price)}/${S.unit}</span>`:
        `<span><b class="pill g">Good</b> ${S.tiers.Good.mean}</span>
        <span><b class="pill b">Better</b> ${S.tiers.Better.mean}</span>
        <span><b class="pill p">Best</b> ${S.tiers.Best.mean}</span>`}</div>`;
    if(S.q&&S.q.length&&!guest){h+=S.q.map(q=>`<div class="q"><label>${q.label}</label>
        <select onchange="setAns('${k}','${q.k}',this.value)">${q.opts.map(o=>`<option ${((sysAnswers[k]||{})[q.k]===o)?'selected':''}>${o}</option>`).join("")}</select></div>`).join("");}
    h+=`<div class="quickset no-print"><span class="lb">Included rooms:</span>${S.flat?'':
        `<button class="qbtn g" onclick="setAll('${k}','Good')">Good</button>
        <button class="qbtn b" onclick="setAll('${k}','Better')">Better</button>
        <button class="qbtn p" onclick="setAll('${k}','Best')">Best</button>`}
        <button class="qbtn" onclick="allOn('${k}',true)">Select all</button>
        <button class="qbtn" onclick="allOn('${k}',false)">Clear</button></div>`;
    rooms.forEach(r=>{const a=assign[k][r.id];
      h+=`<div class="assignrow ${a.on?'':'off'}">
        <div style="display:flex;align-items:center;gap:12px"><div class="toggle ${a.on?'on':''}" onclick="toggleRoom('${k}',${r.id})"></div>
          <div><b>${esc(r.name)}</b><div class="loc">${esc(r.bldg)} · ${esc(r.floor)}</div></div></div>
        ${S.flat?
          (S.types?`<select class="tierpick" ${a.on?'':'disabled'} onchange="setKind('${k}',${r.id},this.value)">
            ${S.types.map(tp=>`<option value="${tp.k}" ${((a.kind||S.types[0].k)===tp.k)?'selected':''}>${tp.label} · ${money(tp.price)}</option>`).join("")}</select>`
          :`<div class="tierpick" style="display:flex;align-items:center;color:var(--muted);font-size:12px">Standard · ${money(S.tiers.Good.price)}/${S.unit}</div>`)
        :
        `<select class="tierpick" ${a.on?'':'disabled'} onchange="setTier('${k}',${r.id},this.value)">
          ${(S.prewire&&!S.spkPerZone)?`<option ${a.pw?'selected':''}>Pre-wire · ${money(S.prewire)}</option>`:''}
          ${TIERS.map(t=>`<option ${(!a.pw&&a.tier===t)?'selected':''}>${t} · ${money(S.tiers[t].price)}/${S.unit}</option>`).join("")}</select>`}
        ${S.spkPerZone?
          `<select class="qtybox" ${a.on?'':'disabled'} onchange="setSpk('${k}',${r.id},this.value)" title="Speakers in room">
            <option value="pw" ${a.pw?'selected':''}>Pre-wire</option>
            ${[2,4,6,8].map(n=>`<option value="${n}" ${(!a.pw&&(a.qty||1)*S.spkPerZone===n)?'selected':''}>${n} spk</option>`).join("")}</select>`
          :
          `<input class="qtybox" type="number" min="1" value="${a.qty||1}" ${a.on?'':'disabled'} onchange="setQty('${k}',${r.id},this.value)" title="Qty of ${S.unit}s">`}
        <div class="rowline">${a.on?money(roomUnitCost(k,a)):'—'}</div></div>`;});
    if(S.headend&&headendPrice(k)>0)h+=`<div class="assignrow"><div><b>Head-end / infrastructure</b><div class="loc">${S.headend.label}</div></div><div></div><div></div><div class="rowline">${money(headendPrice(k))}</div></div>`;
    h+=`</div></div>`;});
  h+=`<div class="navbtns"><button class="btn ghost" onclick="back()">← Back</button><button class="btn primary" onclick="next()">See the report →</button></div></div>`;
  h+=railHTML();h+=`</div>`;
  $("screen").innerHTML=h;
}
function setAns(k,q,v){if(!sysAnswers[k])sysAnswers[k]={};sysAnswers[k][q]=v;}
function toggleRoom(k,id){assign[k][id].on=!assign[k][id].on;render();}
function setTier(k,id,v){const t=v.split(" · ")[0];const a=assign[k][id];
  if(t==='Pre-wire'){a.pw=true;}else{a.pw=false;a.tier=t;}
  render();}
function setSfTier(k,t){sfTier[k]=t;render();}
function setQty(k,id,v){assign[k][id].qty=Math.max(1,parseInt(v)||1);render();}
function setSpk(k,id,v){const S=SYSTEMS[k];const a=assign[k][id];
  if(v==='pw'){a.pw=true;}
  else{a.pw=false;const per=S.spkPerZone||2;const spk=Math.max(per,parseInt(v)||per);a.qty=Math.max(1,Math.round(spk/per));}
  render();}
function setKind(k,id,v){assign[k][id].kind=v;render();}
function setAll(k,t){allRooms().forEach(r=>{if(assign[k][r.id].on)assign[k][r.id].tier=t;});render();}
function allOn(k,v){allRooms().forEach(r=>assign[k][r.id].on=v);render();}

function railHTML(){const t=totals();const band=project.band/100;
  return `<div class="rail"><div class="card">
    <h2 class="t" style="font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2)">Live budget</h2>
    <div class="romband"><div class="big">${money(t.total)}</div>
      <div class="rng">Budget range ±${project.band}% · ${money(t.total*(1-band))} – ${money(t.total*(1+band))}</div>
      ${project.homeSF>0?`<div class="note" style="margin-top:6px">${money(t.total/project.homeSF)} / SF</div>`:''}</div>
    <div class="sumline tot"><span>Total Budget</span><span>${money(t.total)}</span></div>
    <div class="note" style="margin-top:10px">${selected.size} systems · ${allRooms().length} rooms · all-in (equipment, labor, tax &amp; freight)</div></div></div>`;
}

function sysDesc(k){const a=sysAnswers[k];if(!a)return"";const p=Object.keys(a).map(q=>a[q]);return p.length?` <span class="note">(${p.join(" · ")})</span>`:"";}

/* structure mutations */
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function today(){const d=new Date(2026,6,24);return d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});}
function addB(){const n=$("newb").value.trim()||("Building "+(structure.length+1));structure.push({id:bid++,name:n,floors:[{id:fid++,name:"Main Level",rooms:[]}]});_focusId="newb";render();}
function delB(id){if(!confirm("Remove building and its rooms?"))return;structure=structure.filter(b=>b.id!==id);rebuildAssign();render();}
function renameB(id,v){const b=structure.find(x=>x.id===id);if(b)b.name=v;}
function addF(bid_){const b=structure.find(x=>x.id===bid_);const nm=$("fn_"+bid_).value.trim()||("Floor "+(b.floors.length+1));b.floors.push({id:fid++,name:nm,rooms:[]});_focusId="fn_"+bid_;render();}
function delF(id){structure.forEach(b=>b.floors=b.floors.filter(f=>f.id!==id));rebuildAssign();render();}
function renameF(id,v){structure.forEach(b=>b.floors.forEach(f=>{if(f.id===id)f.name=v;}));}
function addR(fid_){structure.forEach(b=>b.floors.forEach(f=>{if(f.id===fid_){const type=$("rt_"+fid_).value;const name=$("rn_"+fid_).value.trim()||type;f.rooms.push({id:rid++,name:name,type:type});$("rn_"+fid_).value="";}}));rebuildAssign();_focusId="rn_"+fid_;render();}
function delR(id){structure.forEach(b=>b.floors.forEach(f=>f.rooms=f.rooms.filter(r=>r.id!==id)));rebuildAssign();render();}
function setP(k,v){project[k]=(k==='name'||k==='client'||k==='gc'||k==='arch')?v:(parseFloat(v)||0);render();}

function toggleGuest(){guest=!guest;{const g=$("gbtn");if(g)g.textContent=guest?"Back to internal":"Guest preview";}render();}

function toast(msg,isErr){const t=$("toast");t.textContent=msg;t.className="toast show"+(isErr?" err":"");setTimeout(()=>t.className="toast",2600);}
function showView(v){
  ["view-auth","view-dashboard","view-admin","view-app"].forEach(id=>{const e=$(id);if(e)e.style.display=(id==="view-"+v)?(v==="auth"?"grid":"block"):"none";});
  $("apphdr").style.display = v==="auth" ? "none" : "flex";
  setTopbar(v);
}
function setTopbar(v){
  const tb=$("topbar"); if(!tb)return;
  const who = meProfile ? `<div class="who"><b>${esc(meProfile.firm_name)}</b><br>${esc(meProfile.email||"")}</div>` : "";
  if(v==="app"){
    tb.innerHTML = `<button class="btn ghost mini no-print" onclick="backToDash()">← Budgets</button>
      <button class="btn primary mini no-print" onclick="saveBudget()">💾 Save</button>`;
  } else if(v==="dashboard"||v==="admin"){
    tb.innerHTML = who + `<button class="btn ghost mini" onclick="doLogout()">Sign out</button>`;
  } else tb.innerHTML="";
}

async function boot(){
  $("authlogo").src=document.querySelector("header img.logo").src;
  try{ sb=supabase.createClient(SB_URL,SB_KEY); }catch(e){ showView("auth"); return; }
  const {data:{session}}=await sb.auth.getSession();
  if(session){ await afterLogin(); } else { showView("auth"); }
}
async function loadMyProfile(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return null;
  const {data}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  return data;
}
async function afterLogin(){
  meProfile=await loadMyProfile();
  if(!meProfile||!meProfile.active){ await sb.auth.signOut(); showAuthErr("This account is not active. Contact Tech Savvy."); showView("auth"); return; }
  $("dash_admin").style.display = meProfile.role==="admin" ? "" : "none";
  try{ const {data}=await sb.from("firm_directory").select("firm_name,firm_type").order("firm_name"); FIRMS=data||[]; }catch(e){ FIRMS=[]; }
  await showDash();
}
function showAuthErr(m){const e=$("li_err");e.textContent=m;e.className="autherr show";}
async function doLogin(){
  const email=$("li_email").value.trim(), pw=$("li_pw").value;
  if(!email||!pw){showAuthErr("Enter your email and password.");return;}
  $("li_btn").disabled=true; $("li_btn").textContent="Signing in…"; $("li_err").className="autherr";
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  $("li_btn").disabled=false; $("li_btn").textContent="Sign in";
  if(error){ showAuthErr(/Invalid/i.test(error.message)?"Incorrect email or password.":error.message); return; }
  $("li_pw").value=""; await afterLogin();
}
async function doLogout(){ await sb.auth.signOut(); meProfile=null; currentBudgetId=null; showView("auth"); }

/* ---------- dashboard ---------- */
async function showDash(){
  showView("dashboard");
  const isAdmin=meProfile.role==="admin";
  $("dash_title").textContent = isAdmin ? "All budgets" : meProfile.firm_name+" — budgets";
  $("dash_sub").textContent = isAdmin ? "Every firm's budgets, grouped by who created them. You have full access." : "Your team's budgets, projects where you're the GC or architect, plus anything Tech Savvy has shared with you.";
  $("bgrid").innerHTML=`<div class="emptybox">Loading…</div>`;
  const {data:{user}}=await sb.auth.getUser(); const uid=user.id;
  const {data:budgets,error}=await sb.from("budgets").select("id,name,client,gc,total,updated_at,owner,owner_firm").order("updated_at",{ascending:false});
  if(error){$("bgrid").innerHTML=`<div class="emptybox">Couldn't load budgets: ${esc(error.message)}</div>`;return;}
  if(!budgets||!budgets.length){ $("bgrid").innerHTML=`<div class="emptybox">No budgets yet. Click <b>+ New budget</b> to create your first one.</div>`; return; }
  const {data:shares}=await sb.from("budget_shares").select("budget_id,firm_id,firm_name");
  const sharedToMe=new Set(); const sharesBy={};
  (shares||[]).forEach(s=>{ if(s.firm_id===uid) sharedToMe.add(s.budget_id); (sharesBy[s.budget_id]=sharesBy[s.budget_id]||[]).push(s.firm_name); });
  let firmNames=new Set();
  if(isAdmin){ const {data:profs}=await sb.from("profiles").select("firm_name").eq("role","firm"); (profs||[]).forEach(p=>firmNames.add((p.firm_name||"").trim().toLowerCase())); }
  const myFirm=(meProfile.firm_name||"").trim().toLowerCase();
  let list=budgets.slice();
  if(isAdmin) list.sort((a,b)=>(a.owner_firm||"").localeCompare(b.owner_firm||"")||(a.updated_at<b.updated_at?1:-1));
  $("bgrid").innerHTML=list.map(b=>{
    const mine=b.owner===uid; const shareNames=sharesBy[b.id]||[]; const creator=b.owner_firm||"";
    const gcMatch=!!myFirm&&(b.gc||"").trim().toLowerCase()===myFirm;
    let badges="";
    if(!isAdmin&&!mine){
      if(sharedToMe.has(b.id)) badges+=`<span class="sbadge shared">Shared with you</span>`;
      else if(gcMatch) badges+=`<span class="sbadge role">You're the GC</span>`;
      else badges+=`<span class="sbadge role">You're the architect</span>`;
    }
    if(isAdmin&&b.gc&&firmNames.has((b.gc||"").trim().toLowerCase())) badges+=`<span class="sbadge role">GC ${esc(b.gc)} has access</span>`;
    if((mine||isAdmin)&&shareNames.length) badges+=`<span class="sbadge out">Shared → ${shareNames.map(esc).join(", ")}</span>`;
    return `<div class="bcard" onclick="openBudget('${b.id}')">
    <div class="nm">${esc(b.name||"Untitled")}</div>
    <div class="meta">${[b.client&&("Client: "+esc(b.client)),b.gc&&("GC: "+esc(b.gc))].filter(Boolean).join(" · ")||"—"}</div>
    <div class="amt">${money(b.total||0)}</div>
    <div class="meta" style="margin-top:2px">Updated ${fmtDate(b.updated_at)}</div>
    ${(isAdmin||!mine)&&creator?`<div class="firmtag">${esc(creator)}</div>`:""}
    ${badges?`<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${badges}</div>`:""}
    <div class="acts" onclick="event.stopPropagation()">
      <button class="btn ghost" onclick="openBudget('${b.id}')">Open</button>
      ${isAdmin?`<button class="btn ghost" onclick="openShare('${b.id}','${esc((b.name||'').replace(/'/g,''))}')">Share</button>`:""}
      <button class="btn ghost" onclick="dupBudget('${b.id}')">Duplicate</button>
      ${(mine||isAdmin)?`<button class="btn danger" onclick="delBudget('${b.id}','${esc((b.name||'').replace(/'/g,''))}')">Delete</button>`:""}
    </div></div>`;}).join("");
}
let _shareCtx={id:null,firms:{}};
async function openShare(id,name){
  modalHTML(`<h3>Share this budget</h3>
    <p class="hint" style="margin-top:-4px">Give a partner firm access to open and edit <b>${esc(name)}</b> from their own dashboard. They can view and edit; only you or Tech Savvy can delete it.</p>
    <div id="share_list"><div class="emptybox">Loading…</div></div>
    <div class="navbtns"><span></span><button class="btn primary" onclick="closeModal()">Done</button></div>`);
  const [fr,sh]=await Promise.all([
    sb.from("profiles").select("id,firm_name,firm_type").eq("role","firm").order("firm_name"),
    sb.from("budget_shares").select("firm_id").eq("budget_id",id)
  ]);
  const firms=fr.data||[]; const shared=new Set((sh.data||[]).map(s=>s.firm_id));
  _shareCtx={id,firms:{}}; firms.forEach(f=>_shareCtx.firms[f.id]=f.firm_name);
  if(!firms.length){$("share_list").innerHTML=`<div class="emptybox">No partner firms yet. Add one under <b>Manage firms</b>.</div>`;return;}
  $("share_list").innerHTML=firms.map(f=>`<div class="sharerow">
    <div><b style="color:var(--ink)">${esc(f.firm_name)}</b> <span class="note">${esc(f.firm_type||"")}</span></div>
    <button class="btn ${shared.has(f.id)?'primary':'ghost'}" id="sh_${f.id}" data-on="${shared.has(f.id)?1:0}" onclick="toggleShare('${f.id}')">${shared.has(f.id)?'Shared ✓':'Share'}</button>
  </div>`).join("");
}
async function toggleShare(fid){
  const bid=_shareCtx.id; const btn=$("sh_"+fid); if(!btn)return; const on=btn.getAttribute("data-on")==="1";
  btn.disabled=true;
  if(on){ const {error}=await sb.from("budget_shares").delete().eq("budget_id",bid).eq("firm_id",fid); if(error){toast(error.message,true);btn.disabled=false;return;} }
  else { const {data:{user}}=await sb.auth.getUser(); const {error}=await sb.from("budget_shares").insert({budget_id:bid,firm_id:fid,firm_name:_shareCtx.firms[fid]||null,shared_by:user.id}); if(error){toast(error.message,true);btn.disabled=false;return;} }
  btn.disabled=false; btn.setAttribute("data-on",on?"0":"1");
  btn.className="btn "+(on?"ghost":"primary"); btn.textContent=on?"Share":"Shared ✓";
  toast(on?"Access removed":"Shared with partner");
}
function fmtDate(s){if(!s)return"";const d=new Date(s);return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});}

/* ---------- serialize / hydrate ---------- */
function serialize(){return {structure,selected:[...selected],assign,sysAnswers,sfTier,project,ids:{rid,fid,bid}};}
function hydrate(d){
  structure=d.structure||[]; selected=new Set(d.selected||[]); assign=d.assign||{}; sysAnswers=d.sysAnswers||{}; sfTier=d.sfTier||{};
  Object.assign(project,d.project||{});
  project.band=3; project.cont=0; // fixed planning band; contingency removed (tool reads to actual)
  delete project._ot_gc; delete project._ot_arch; _otherFlags={};
  if(d.ids){rid=d.ids.rid||1;fid=d.ids.fid||1;bid=d.ids.bid||1;}
  rebuildAssign();
}
function freshState(){
  rid=1;fid=1;bid=1; structure=[{id:bid++,name:"Main House",floors:[{id:fid++,name:"Main Level",rooms:[]}]}];
  selected=new Set(["network","control","audio","video","lighting"]); assign={}; sysAnswers={}; sfTier={network:"Better"};
  Object.assign(project,{name:"New Residence",client:"",gc:"",arch:"",zip:"",band:3,cont:0,tax:8.625,freight:2,homeSF:0});
  rebuildAssign(); guest=false; step=0; currentBudgetId=null; _otherFlags={};
}
function newBudget(){ freshState(); showView("app"); render(); }
async function openBudget(id){
  const {data,error}=await sb.from("budgets").select("*").eq("id",id).maybeSingle();
  if(error||!data){toast("Couldn't open budget",true);return;}
  hydrate(data.data||{}); currentBudgetId=data.id; guest=false; step=4; showView("app"); render();
}
async function dupBudget(id){
  const {data}=await sb.from("budgets").select("*").eq("id",id).maybeSingle();
  if(!data)return;
  const {data:me}=await sb.auth.getUser();
  const row={owner:me.user.id,owner_firm:(meProfile&&meProfile.firm_name||null),name:(data.name||"Untitled")+" (copy)",client:data.client,gc:data.gc,total:data.total,data:data.data};
  const {error}=await sb.from("budgets").insert(row);
  if(error){toast("Duplicate failed",true);return;} toast("Budget duplicated"); showDash();
}
function delBudget(id,name){
  confirmModal(`Delete "${name||'this budget'}"? This can't be undone.`, async()=>{
    const {error}=await sb.from("budgets").delete().eq("id",id);
    if(error){toast("Delete failed",true);return;} toast("Budget deleted"); showDash();
  });
}
function backToDash(){ showDash(); }
async function saveBudget(){
  if(!sb){toast("Not connected",true);return;}
  const {data:{user}}=await sb.auth.getUser();
  const row={owner:currentBudgetId?undefined:user.id,owner_firm:currentBudgetId?undefined:(meProfile&&meProfile.firm_name||null),name:project.name||"Untitled Budget",client:project.client||"",gc:project.gc||"",total:Math.round(totals().total),data:serialize(),updated_at:new Date().toISOString()};
  let res;
  if(currentBudgetId){ delete row.owner; delete row.owner_firm; res=await sb.from("budgets").update(row).eq("id",currentBudgetId).select("id").maybeSingle(); }
  else { res=await sb.from("budgets").insert(row).select("id").maybeSingle(); }
  if(res.error){toast("Save failed: "+res.error.message,true);return;}
  if(res.data) currentBudgetId=res.data.id;
  toast("✓ Saved to cloud");
}

/* ---------- admin: firm management ---------- */
async function showAdmin(){ showView("admin"); await loadFirms(); }
async function loadFirms(){
  $("firmtable").innerHTML=`<div class="emptybox">Loading…</div>`;
  const {data,error}=await sb.functions.invoke("firm-admin",{body:{action:"list_firms"}});
  if(error||data?.error){$("firmtable").innerHTML=`<div class="emptybox">${esc(data?.error||error.message)}</div>`;return;}
  const firms=data.firms||[];
  if(!firms.length){$("firmtable").innerHTML=`<div class="emptybox">No firm accounts yet. Click <b>+ Add firm</b> to create one.</div>`;return;}
  $("firmtable").innerHTML=`<table class="atable"><thead><tr><th>Firm</th><th>Type</th><th>Login email</th><th>Budgets</th><th>Status</th><th></th></tr></thead><tbody>`+
    firms.map(f=>`<tr>
      <td style="color:var(--ink);font-weight:600">${esc(f.firm_name)}</td>
      <td>${esc(f.firm_type)}</td>
      <td>${esc(f.email||"")}</td>
      <td>${f.budget_count}</td>
      <td>${f.active?'<span class="pill b">Active</span>':'<span class="pill" style="background:rgba(242,109,109,.18);color:#f6a5a5">Disabled</span>'}</td>
      <td style="white-space:nowrap">
        <button class="btn ghost" onclick="resetFirmPw('${f.id}','${esc(f.firm_name)}')">Reset PW</button>
        <button class="btn ghost" onclick="toggleFirm('${f.id}',${f.active?'false':'true'})">${f.active?'Disable':'Enable'}</button>
        <button class="btn danger" onclick="deleteFirm('${f.id}','${esc(f.firm_name)}')">Delete</button>
      </td></tr>`).join("")+`</tbody></table>`;
}
function openAddFirm(){
  modalHTML(`<h3>Add a firm account</h3>
    <div class="field"><label>Firm name</label><input id="af_name" placeholder="Acme Builders"></div>
    <div class="row"><div class="field"><label>Type</label><select id="af_type"><option>GC</option><option>Architect</option><option>Other</option></select></div>
    <div class="field"><label>Login email</label><input id="af_email" type="email" placeholder="team@acme.com"></div></div>
    <div class="field"><label>Temporary password</label><input id="af_pw" value="${randPw()}"></div>
    <div class="autherr" id="af_err"></div>
    <div class="navbtns"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="af_btn" onclick="submitAddFirm()">Create firm login</button></div>`);
}
async function submitAddFirm(){
  const firm_name=$("af_name").value.trim(), firm_type=$("af_type").value, email=$("af_email").value.trim(), password=$("af_pw").value;
  if(!firm_name||!email||!password){$("af_err").textContent="Firm name, email and password are required.";$("af_err").className="autherr show";return;}
  $("af_btn").disabled=true;$("af_btn").textContent="Creating…";
  const {data,error}=await sb.functions.invoke("firm-admin",{body:{action:"create_firm",firm_name,firm_type,email,password}});
  $("af_btn").disabled=false;$("af_btn").textContent="Create firm login";
  if(error||data?.error){$("af_err").textContent=data?.error||error.message;$("af_err").className="autherr show";return;}
  closeModal(); toast("Firm login created"); loadFirms();
}
function resetFirmPw(id,name){
  modalHTML(`<h3>Reset password — ${esc(name)}</h3>
    <div class="field"><label>New password</label><input id="rp_pw" value="${randPw()}"></div>
    <div class="autherr" id="rp_err"></div>
    <div class="navbtns"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="rp_btn" onclick="submitResetPw('${id}')">Set new password</button></div>`);
}
async function submitResetPw(id){
  const password=$("rp_pw").value;
  $("rp_btn").disabled=true;
  const {data,error}=await sb.functions.invoke("firm-admin",{body:{action:"reset_password",user_id:id,password}});
  if(error||data?.error){$("rp_err").textContent=data?.error||error.message;$("rp_err").className="autherr show";$("rp_btn").disabled=false;return;}
  closeModal(); toast("Password updated");
}
function toggleFirm(id,active){
  sb.functions.invoke("firm-admin",{body:{action:"set_active",user_id:id,active}}).then(({data,error})=>{
    if(error||data?.error){toast(data?.error||error.message,true);return;} toast(active?"Firm enabled":"Firm disabled"); loadFirms();});
}
function deleteFirm(id,name){
  confirmModal(`Delete "${name}" and all their budgets? This can't be undone.`, async()=>{
    const {data,error}=await sb.functions.invoke("firm-admin",{body:{action:"delete_firm",user_id:id}});
    if(error||data?.error){toast(data?.error||error.message,true);return;} toast("Firm deleted"); loadFirms();
  });
}
function changeMyPw(){
  modalHTML(`<h3>Change my password</h3>
    <div class="field"><label>New password</label><input id="mp_pw" type="password" placeholder="New password (6+ chars)"></div>
    <div class="autherr" id="mp_err"></div>
    <div class="navbtns"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="mp_btn" onclick="submitMyPw()">Update password</button></div>`);
}
async function submitMyPw(){
  const password=$("mp_pw").value;
  if(!password||password.length<6){$("mp_err").textContent="Password must be at least 6 characters.";$("mp_err").className="autherr show";return;}
  const {error}=await sb.auth.updateUser({password});
  if(error){$("mp_err").textContent=error.message;$("mp_err").className="autherr show";return;}
  closeModal(); toast("Your password was updated");
}
function randPw(){const c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";let s="";for(let i=0;i<10;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}

/* ---------- modal ---------- */
function modalHTML(html){$("modalcard").innerHTML=html;$("modal").className="modal show";}
function closeModal(){$("modal").className="modal";}
function confirmModal(msg,onYes){
  modalHTML(`<h3>Confirm</h3><p style="font-size:14px;color:var(--ink2)">${esc(msg)}</p>
    <div class="navbtns"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="cf_yes">Yes, delete</button></div>`);
  $("cf_yes").onclick=async()=>{closeModal();await onYes();};
}

boot();
</script>
